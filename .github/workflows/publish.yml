name: CI/CD Docs Compiler & Auto Publisher

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for PDF Compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y weasyprint pango1.0-tools fonts-wqy-zenhei

      - name: Install Python Dependencies
        run: |
          pip install mkdocs-material pymdown-extensions weasyprint

      - name: Generate Unified Markdown
        run: |
          python -c "
          files = ['src/index.md', 'src/unit1-geopolitics.md', 'src/unit2-aqvc-framework.md', 'src/unit3-retrofit-mas.md', 'src/unit4-oee-roi.md', 'src/unit5-mlops-scope3.md', 'src/unit6-subsidy-guide.md', 'src/unit7-roadmap-kpi.md']
          with open('src/unified.md', 'w', encoding='utf-8') as outfile:
              for f in files:
                  with open(f, 'r', encoding='utf-8') as infile:
                      outfile.write(infile.read() + '\n\n')
          "

      - name: Build Static Site HTML
        run: |
          mkdocs build --clean
          mkdir -p site/interactive-tool
          cp docs/interactive-tool/index.html site/interactive-tool/index.html

      - name: Generate Unified PDF Whitepaper
        run: |
          # Create output directory for PDF and compile using WeasyPrint on the compiled unified HTML page
          mkdir -p site/pdf
          weasyprint site/unified/index.html site/pdf/taiwan-fastener-ai-whitepaper-latest.pdf

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
