site_name: 台灣扣件產業 AI 轉型白皮書
site_description: 邁向智造時代：從自動化到全局打通的 AI 落地指引 (文件編號：TW-FASTENER-AI-2026-V1.1)
site_author: 台灣扣件產業 AI 轉型研究小組
site_url: https://taiwan-smart-fastener-alliance.github.io/taiwan-fastener-ai-whitepaper/
docs_dir: src

theme:
  name: material
  language: zh-Hant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切換為深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切換為淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - 🏠 首頁: index.md
  - 🌐 產業挑戰與戰略:
    - 單元一：全球地緣政治與數位斷層: unit1-geopolitics.md
    - 單元二：AQVC 數據就緒度框架: unit2-aqvc-framework.md
  - 🛠️ 智造實務與效益:
    - 單元三：IoT 改造與排程失效預案: unit3-retrofit-mas.md
    - 單元四：OEE 與 ROI 量化指標: unit4-oee-roi.md
  - 🌿 永續治理與補助:
    - 單元五：MLOps 與範疇三碳排聯防: unit5-mlops-scope3.md
    - 單元六：政府補助資源精準對接: unit6-subsidy-guide.md
    - 單元七：2026-2030 推進路線圖: unit7-roadmap-kpi.md
  - 📄 資源下載:
    - 📥 完整白皮書一鍵下載 (PDF): unified.md

